[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogate-eval"
version = "0.1.0"
description = "Paired perturbation-response evaluation for scientific surrogate models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KaR7NA16"}]
dependencies = ["numpy>=1.26"]
keywords = ["scientific-computing", "surrogate-models", "sensitivity", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/KaR7NA16/surrogate-eval"
Repository = "https://github.com/KaR7NA16/surrogate-eval"
Issues = "https://github.com/KaR7NA16/surrogate-eval/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.11"]
reproduce = ["scipy>=1.14", "threadpoolctl>=3.5", "torch>=2.5"]

[project.scripts]
surrogate-eval = "surrogate_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
